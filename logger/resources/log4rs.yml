refresh_rate: 30 seconds

appenders:
  stdout:
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S)} | {({l}):5.5} | - {m}{n}"
    kind: console

  file:
    kind: file
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S)} | {({l}):5.5} | - {m}{n}"
    path: "logs/program.log"

root:
  level: debug
  appenders:
    - stdout
    - file