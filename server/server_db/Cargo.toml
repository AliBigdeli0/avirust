[package]
name = "server_db"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.13", features = ["derive"] }
common = { version = "0.1.0", path = "../../utility/common" }
entity = { version = "0.1.0", path = "../../utility/entity" }
logger = { version = "0.1.0", path = "../../utility/logger" }
tokio = { version = "1.34.0", features = ["full"] }

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"