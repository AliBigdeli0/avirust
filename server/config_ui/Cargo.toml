[package]
name = "config_ui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = {version = "0.25.0", default-features = false, features = [
    "accesskit",    
    "default_fonts", 
    "glow",          
    "persistence",  
]}
egui = "0.25.0"
egui-modal = "0.3.2"
